# spell-checker:ignore (features) zerocopy serde

[package]
name = "uutests"
description = "uutils ~ 'core' uutils test library (cross-platform)"
repository = "https://github.com/uutils/coreutils/tree/main/tests/uutests"
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true

[lib]
path = "src/lib/lib.rs"

[target.'cfg(not(target_os = "aix"))'.dependencies]
ctor = { workspace = true }
libc = { workspace = true }
pretty_assertions = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }
uucore = { workspace = true, features = [
  "mode",
  "entries",
  "process",
  "signals",
  "utmpx",
] }

[target.'cfg(all(unix, not(any(target_os = "aix", target_os = "fuchsia"))))'.dependencies]
rlimit = { workspace = true }

[target.'cfg(all(unix, not(any(target_vendor = "apple", target_os = "aix", target_os = "openbsd"))))'.dependencies]
xattr = { workspace = true }

[target.'cfg(all(unix, not(target_os = "aix")))'.dependencies]
nix = { workspace = true, features = ["process", "signal", "term", "user"] }

[lints]
workspace = true
