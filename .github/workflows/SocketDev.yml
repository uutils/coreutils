on: pull_request

permissions:
   contents: read

jobs:
   safe-install:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v7.0.1
         with:
           persist-credentials: false
              
       - uses: SocketDev/action@v1.3.1
         with:
           mode: firewall-free
           
       # rust
       - run: sfw cargo fetch
