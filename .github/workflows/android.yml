name: Android
# spell-checker:ignore (people) reactivecircus
# spell-checker:ignore (shell/tools) udevadm
# spell-checker:ignore (misc) noaudio
env:
  CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER: "x86_64-linux-android28-clang"
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

on:
  pull_request:
  push:
    branches:
      - '*'

permissions:
  contents: read # to fetch code (actions/checkout)

# End the current execution if there is a new changeset in the PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-linux-android
    - uses: Swatinem/rust-cache@v2
    - name: Run sccache-cache
      id: sccache-setup
      uses: mozilla-actions/sccache-action@v0.0.11
      continue-on-error: true
    - name: Export sccache
      if: steps.sccache-setup.outcome == 'success'
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
    - name: Set up Android NDK
      run: |
        echo "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
    - name: prepare testing
      run: |
        set -euo pipefail
        # FIXME: some ls::* depends on umask 022
        cargo test --target x86_64-linux-android --no-run --features feat_os_unix_android --message-format=json \
          | jq -rs '
            [ .[] | select(.executable != null) | .executable | select(test("/coreutils$") | not) ]
            | unique
            | .[]
            ' | sed 's#^.*$#adb push & /data/local/tmp/tester\nadb shell "cd /data/local/tmp \&\& umask 022 \&\& /data/local/tmp/tester"#' > tests.sh
        cat tests.sh
    - name: Enable KVM (hardware acceleration)
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: tests
      uses: reactivecircus/android-emulator-runner@v2.38.0
      with:
        api-level: 28
        disable-animations: true
        emulator-options: -no-metrics -no-window -noaudio -no-boot-anim -camera-back none -gpu off
        target: google_apis # default breaks some tests
        arch: x86_64
        script: |
          adb root
          adb shell setenforce 0
          adb shell "mkdir -p /data/data/com.termux/files/usr/bin && ln -svf /system/bin/sh /data/data/com.termux/files/usr/bin/sh" # needed for test_stat
          adb unroot
          adb push tests/fixtures/. /data/local/tmp/tests/fixtures/
          adb push target/x86_64-linux-android/debug/coreutils /data/local/tmp/coreutils
          sh -e ./tests.sh
