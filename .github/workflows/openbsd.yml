name: OpenBSD

# spell-checker:ignore sshfs usesh vmactions taiki esac fdescfs fdesc nextest copyback logind

env:
  FEATURES: "feat_Tier1,feat_require_unix"
  # * style job configuration
  STYLE_FAIL_ON_FAULT: true ## (bool) fail the build if a style job contains a fault (error or warning); may be overridden on a per-job basis

on:
  pull_request:
  push:
    branches:
      - '*'

permissions:
  contents: read # to fetch code (actions/checkout)

# End the current execution if there is a new changeset in the PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  style:
    name: Style and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rust-src
    - uses: Swatinem/rust-cache@v2
    - name: Run sccache-cache
      id: sccache-setup
      uses: mozilla-actions/sccache-action@v0.0.11
      continue-on-error: true
    - name: Export sccache
      if: steps.sccache-setup.outcome == 'success'
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
    - uses: mlugg/setup-zig@v2.2.1
    - uses: taiki-e/install-action@cargo-zigbuild
    - name: cargo clippy
      env:
        CARGO_INCREMENTAL: "0"
        RUSTC_BOOTSTRAP: "1"
      run: |
        # Set linker for stdbuf. env: and -Z do not work. Override `config.toml` to avoid duplicated keys.
        # We don't use `aws-lc` at here.
        cat << 'EOF' > .cargo/config.toml
        [target.x86_64-unknown-openbsd]
        linker = "cargo-zigbuild"
        [unstable]
        build-std = ["std", "panic_abort"]
        EOF
        UTILS=$(cargo tree --depth 1 --features ${{ env.FEATURES }} --format '{lib}' --prefix none | sed -n 's/^uu_/-p uu_/p')
        cargo-zigbuild clippy --target x86_64-unknown-openbsd --features ${{ env.FEATURES }} -p coreutils ${UTILS} --all-targets --tests --benches -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Avoid no space left on device # shared with guest?
      shell: bash
      run: |
        mkdir /tmp/empty
        sudo rsync -a --delete /tmp/empty/ /usr/lib/jvm/
        sudo rsync -a --delete /tmp/empty/ /usr/share/dotnet/
        sudo rsync -a --delete /tmp/empty/ /usr/local/lib/android/
    - name: Prepare, build and test
      uses: vmactions/openbsd-vm@v1
      with:
        usesh: true
        sync: rsync
        copyback: false
        mem: 6144
        # Install rust and build dependencies
        prepare: |
          # Clean up disk space before installing packages
          df -h
          mkdir -p empty
          rsync -a --delete empty/ /usr/share/relink/
          rsync -a --delete empty/ /usr/X11R6/
          rsync -a --delete empty/ /usr/share/doc/
          rsync -a --delete empty/ /usr/share/man/
          pkg_add curl gmake sudo-- rust
          # Clean up package cache after installation
          pkg_delete -a
          df -h
        run: |
          ## Prepare, build, and test
          # implementation modelled after ref: <https://github.com/rust-lang/rustup/pull/2783>
          # * NOTE: All steps need to be run in this block, otherwise, we are operating back on the mac host
          set -e
          #
          export CARGO_INCREMENTAL=0
          TEST_USER=tester
          REPO_NAME=${GITHUB_WORKSPACE##*/}
          WORKSPACE_PARENT="/home/runner/work/${REPO_NAME}"
          WORKSPACE="${WORKSPACE_PARENT}/${REPO_NAME}"
          #
          useradd -m -G wheel ${TEST_USER}
          chown -R ${TEST_USER}:wheel /root/ "${WORKSPACE_PARENT}"/
          whoami
          # Add fake host for reverse DNS lookup (needed for hostname test)
          printf "10.0.2.15\topenbsd.my.domain openbsd\n" >> /etc/hosts
          #
          # Further work needs to be done in a sudo as we are changing users
          sudo -i -u ${TEST_USER} sh << EOF
          set -e
          whoami
          # Increase max open files (512 by default)
          ulimit -n 1024
          # todo: install nextest if official OpenBSD package was provided
          # Use regular cargo test currently
          ## Info
          echo "::group::environment"
          echo "CI='${CI}'"
          echo "REPO_NAME='${REPO_NAME}'"
          echo "TEST_USER='${TEST_USER}'"
          echo "WORKSPACE_PARENT='${WORKSPACE_PARENT}'"
          echo "WORKSPACE='${WORKSPACE}'"
          env | sort
          echo "::endgroup::"
          echo "::group::tooling info"
          cargo -V
          rustc -V
          echo "::endgroup::"
          #
          # To ensure that files are cleaned up, we don't want to exit on error
          set +e
          cd "${WORKSPACE}"
          unset FAULT
          # openbsd is very slow. Omit duplicated cargo build and do test only
          export RUST_BACKTRACE=1
          export CARGO_TERM_COLOR=always
          # Avoid filling disk space
          export RUSTFLAGS="-C strip=symbols"
          # vendored OpenSSL takes many times to build. Use system one (LibreSSL is supported).
          export OPENSSL_NO_VENDOR=1 OPENSSL_DIR=/usr
          # Use cargo test since nextest might not support OpenBSD
          if (test -z "\$FAULT"); then
            echo "::group::cargo test (workspace)"
            cargo test --features ${{ env.FEATURES }} || FAULT=1
            echo "::endgroup::"
          fi
          if (test -z "\$FAULT"); then
            echo "::group::cargo test (uucore)"
            cargo test --all-features -p uucore || FAULT=1
            echo "::endgroup::"
          fi
          # Test building with make
          if (test -z "\$FAULT"); then
            echo "::group::make MULTICALL=Y"
            make MULTICALL=Y || FAULT=1
            echo "::endgroup::"
          fi
          # Clean to avoid to rsync back the files and free up disk space
          cargo clean
          # Additional cleanup to free disk space
          if (test -n "\$FAULT"); then exit 1 ; fi
          EOF
