name: OpenBSD

# spell-checker:ignore sshfs usesh vmactions taiki esac fdescfs fdesc mlugg copyback logind zigbuild

env:
  FEATURES: "feat_Tier1,feat_require_unix"
  CARGO_INCREMENTAL: "0"
  # https://github.com/vmactions/openbsd-vm/tree/v1/conf
  OPENBSD_ABI: "8.0"
  RUSTFLAGS: "-C strip=symbols" # Avoid filling disk space
  RUST_BACKTRACE: "1"
  RUSTC_BOOTSTRAP: "1" # use build-std

on:
  pull_request:
  push:
    branches:
      - '*'

permissions:
  contents: read # to fetch code (actions/checkout)

# End the current execution if there is a new changeset in the PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  style:
    name: clippy and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Avoid no space left on device
      shell: bash
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android &
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rust-src
    - uses: Swatinem/rust-cache@v2
    - name: Run sccache-cache
      id: sccache-setup
      uses: mozilla-actions/sccache-action@v0.0.11
      continue-on-error: true
    - name: Export sccache
      if: steps.sccache-setup.outcome == 'success'
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
    - uses: mlugg/setup-zig@v2.2.1
    - uses: taiki-e/install-action@cargo-zigbuild
    - name: cargo clippy
      run: |
        # Set linker for stdbuf. env: and -Z do not work. Override `config.toml` to avoid duplicated keys.
        # We don't use `aws-lc` at here.
        cat << 'EOF' > .cargo/config.toml
        [target.x86_64-unknown-openbsd]
        linker = "cargo-zigbuild"
        [unstable]
        build-std = ["std", "panic_abort"]
        EOF
        UTILS=$(cargo tree --depth 1 --features ${{ env.FEATURES }} --format '{lib}' --prefix none | sed -n 's/^uu_/-p uu_/p')
        cargo-zigbuild clippy --target x86_64-unknown-openbsd.${{ env.OPENBSD_ABI }} --features ${{ env.FEATURES }} -p coreutils ${UTILS} --all-targets --tests --benches -- -D warnings
    - name: prepare testing
      run: |
        cargo-zigbuild test --target x86_64-unknown-openbsd.${{ env.OPENBSD_ABI }} --no-run --features ${{ env.FEATURES }} --message-format=json \
          | jq -rs '
            [ .[] | select(.executable != null) | .executable | select(test("/coreutils$") | not) ]
            | unique
            | .[]
            ' > tests.sh
        # we test all features with actual consumers (${{ env.FEATURES }},openssl) on the VM without zig.
        rm .cargo/config.toml
    - name: test
      uses: vmactions/openbsd-vm@v1
      with:
        usesh: true
        sync: rsync
        copyback: false
        release: ${{ env.OPENBSD_ABI }}
        mem: 6144
        prepare: |
          # Clean up disk space before installing packages
          df -h
          mkdir -p empty
          rsync -a --delete empty/ /usr/share/relink/
          rsync -a --delete empty/ /usr/X11R6/
          rsync -a --delete empty/ /usr/share/doc/
          rsync -a --delete empty/ /usr/share/man/
          pkg_add gmake sudo-- rust
          # Clean up package cache after installation
          pkg_delete -a
          df -h
        run: |
          ## test
          set -e
          #
          TEST_USER=tester
          REPO_NAME=${GITHUB_WORKSPACE##*/}
          WORKSPACE_PARENT="/home/runner/work/${REPO_NAME}"
          WORKSPACE="${WORKSPACE_PARENT}/${REPO_NAME}"
          #
          useradd -m -G wheel ${TEST_USER}
          chown -R ${TEST_USER}:wheel /root/ "${WORKSPACE_PARENT}"/
          whoami
          # Add fake host for reverse DNS lookup (needed for hostname test)
          printf "10.0.2.15\topenbsd.my.domain openbsd\n" >> /etc/hosts
          #
          # Further work needs to be done in a sudo as we are changing users
          sudo -i -u ${TEST_USER} sh << EOF
          set -e
          whoami
          # Increase max open files (512 by default)
          ulimit -n 1024
          ## Info
          echo "CI='${CI}'"
          echo "REPO_NAME='${REPO_NAME}'"
          echo "TEST_USER='${TEST_USER}'"
          echo "WORKSPACE_PARENT='${WORKSPACE_PARENT}'"
          echo "WORKSPACE='${WORKSPACE}'"
          env | sort
          #
          # To ensure that files are cleaned up, we don't want to exit on error
          set +e
          cd "${WORKSPACE}"
          unset FAULT
          cp -v target/x86_64-unknown-openbsd/debug/coreutils /tmp/coreutils
          export UUTESTS_BINARY_PATH=/tmp/coreutils
          while IFS= read -r bin;do
            "\${bin}" || FAULT=1 # todo: retry tests (should we nextest on the MV instead?)
          done < ./tests.sh
          # Test GNUmakefile and system LibreSSL which cannot be covered by zig
          export OPENSSL_NO_VENDOR=1 OPENSSL_DIR=/usr
          export RUSTFLAGS="-C strip=symbols" # Avoid filling disk space
          export CARGOFLAGS="--features=openssl"
          make test MULTICALL=y UTILS=cksum || FAULT=1
          if (test -n "\$FAULT"); then exit 1 ; fi
          EOF
