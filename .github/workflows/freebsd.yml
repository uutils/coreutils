name: FreeBSD

# spell-checker:ignore sshfs usesh vmactions taiki esac fdescfs fdesc mlugg nextest copyback logind zigbuild

env:
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

on:
  pull_request:
  push:
    branches:
      - '*'

permissions:
  contents: read # to fetch code (actions/checkout)

# End the current execution if there is a new changeset in the PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test_zig:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Avoid no space left on device
      shell: bash
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android &
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-freebsd
    - uses: Swatinem/rust-cache@v2
    - name: Run sccache-cache
      id: sccache-setup
      uses: mozilla-actions/sccache-action@v0.0.11
      continue-on-error: true
    - name: Export sccache
      if: steps.sccache-setup.outcome == 'success'
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
    - uses: mlugg/setup-zig@v2.2.1
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-zigbuild
    - name: prepare testing
      run: |
        set -euo pipefail
        # Use static openssl for zigbuild and ask downstream to use vendored one if they see any issue with system one.
        # BSD make's redirection to GNUmakefile is tested at openbsd.yml
        cargo-zigbuild test --target x86_64-unknown-freebsd --no-run --features feat_os_unix,openssl -p uucore -p coreutils --message-format=json \
          | jq -rs '
            [ .[] | select(.executable != null) | .executable | select(test("/coreutils$") | not) ]
            | unique
            | .[]
            ' > tests.sh
        cat tests.sh
    - name: test
      uses: vmactions/freebsd-vm@v1.6.0
      with:
        usesh: true
        sync: rsync
        copyback: false
        prepare: pkg install -y sudo
        run: |
          ## test
          set -e
          #
          # We need a file-descriptor file system to test test_ls::test_ls_io_errors
          mount -t fdescfs fdesc /dev/fd
          #
          TEST_USER=tester
          REPO_NAME=${GITHUB_WORKSPACE##*/}
          WORKSPACE_PARENT="/home/runner/work/${REPO_NAME}"
          WORKSPACE="${WORKSPACE_PARENT}/${REPO_NAME}"
          #
          pw adduser -n ${TEST_USER} -d /root/ -g wheel -c "Coreutils user to build" -w random
          chown -R ${TEST_USER}:wheel /root/ "${WORKSPACE_PARENT}"/
          whoami
          #
          # Further work needs to be done in a sudo as we are changing users
          sudo -i -u ${TEST_USER} sh << EOF
          set -e
          whoami
          ## Info
          # environment
          echo "## environment"
          echo "CI='${CI}'"
          echo "REPO_NAME='${REPO_NAME}'"
          echo "TEST_USER='${TEST_USER}'"
          echo "WORKSPACE_PARENT='${WORKSPACE_PARENT}'"
          echo "WORKSPACE='${WORKSPACE}'"
          env | sort
          set +e
          cd "${WORKSPACE}"
          unset FAULT
          # tests fail without using this path by unknown reason
          cp -v target/x86_64-unknown-freebsd/debug/coreutils /tmp/coreutils
          export UUTESTS_BINARY_PATH=/tmp/coreutils
          export RUST_BACKTRACE=1
          while IFS= read -r bin;do
            "\${bin}" || FAULT=1
          done < ./tests.sh
          if (test -n "\$FAULT"); then exit 1 ; fi
          EOF
