name: FreeBSD

# spell-checker:ignore sshfs usesh vmactions taiki esac fdescfs fdesc mlugg nextest copyback logind zigbuild

env:
  CARGO_INCREMENTAL: "0"
  # https://github.com/vmactions/freebsd-vm/tree/VERSION/conf
  FREEBSD_ABI: "15.1"
  RUST_BACKTRACE: "1"

on:
  pull_request:
  push:
    branches:
      - '*'

permissions:
  contents: read # to fetch code (actions/checkout)

# End the current execution if there is a new changeset in the PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  style:
    name: clippy and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Avoid no space left on device
      shell: bash
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android &
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
        targets: x86_64-unknown-freebsd
    - uses: Swatinem/rust-cache@v2
    - name: Run sccache-cache
      id: sccache-setup
      uses: mozilla-actions/sccache-action@v0.0.11
      continue-on-error: true
    - name: Export sccache
      if: steps.sccache-setup.outcome == 'success'
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
    - uses: mlugg/setup-zig@v2.2.1
    - uses: taiki-e/install-action@cargo-zigbuild
    - name: cargo clippy
      run: |
        UTILS=$(cargo tree --depth 1 --features feat_os_unix --format '{lib}' --prefix none | sed -n 's/^uu_/-p uu_/p')
        cargo-zigbuild clippy --target x86_64-unknown-freebsd.${{ env.FREEBSD_ABI }} --features feat_os_unix -p coreutils ${UTILS} --all-targets --tests --benches -- -D warnings
    - name: prepare testing
      run: |
        # system openssl feature is covered on VM
        cargo-zigbuild test --target x86_64-unknown-freebsd.${{ env.FREEBSD_ABI }} --no-run --features feat_os_unix --message-format=json \
          | jq -rs '
            [ .[] | select(.executable != null) | .executable | select(test("/coreutils$") | not) ]
            | unique
            | .[]
            ' > tests.sh
        cat tests.sh
    - name: test
      uses: vmactions/freebsd-vm@v1.6.0
      with:
        usesh: true
        sync: rsync
        copyback: false
        release: ${{ env.FREEBSD_ABI }}
        prepare: |
          pkg install -y nextest rust sudo
        run: |
          ## test
          set -e
          #
          # We need a file-descriptor file system to test test_ls::test_ls_io_errors
          mount -t fdescfs fdesc /dev/fd
          #
          TEST_USER=tester
          REPO_NAME=${GITHUB_WORKSPACE##*/}
          WORKSPACE_PARENT="/home/runner/work/${REPO_NAME}"
          WORKSPACE="${WORKSPACE_PARENT}/${REPO_NAME}"
          #
          pw adduser -n ${TEST_USER} -d /root/ -g wheel -c "Coreutils user to build" -w random
          chown -R ${TEST_USER}:wheel /root/ "${WORKSPACE_PARENT}"/
          whoami
          #
          # Further work needs to be done in a sudo as we are changing users
          sudo -i -u ${TEST_USER} sh << EOF
          set -e
          whoami
          ## Info
          # environment
          echo "## environment"
          echo "CI='${CI}'"
          echo "REPO_NAME='${REPO_NAME}'"
          echo "TEST_USER='${TEST_USER}'"
          echo "WORKSPACE_PARENT='${WORKSPACE_PARENT}'"
          echo "WORKSPACE='${WORKSPACE}'"
          env | sort
          # tooling info
          echo "## tooling info"
          cargo -V
          cargo nextest --version
          rustc -V
          #
          # To ensure that files are cleaned up, we don't want to exit on error
          set +e
          cd "${WORKSPACE}"
          unset FAULT
          # retry tests when exit code was fixed <https://github.com/uutils/coreutils/issues/3779>
          while IFS= read -r bin;do
            "\${bin}" || FAULT=1
          done < ./tests.sh
          export CARGO_INCREMENTAL=0
          export RUST_BACKTRACE=1
          # openssl cannot be built by zig
          export OPENSSL_NO_VENDOR=1 OPENSSL_DIR=/usr
          if (test -z "\$FAULT"); then cargo nextest run --hide-progress-bar --profile ci --all-features -p uucore || FAULT=1 ; fi
          if (test -z "\$FAULT"); then cargo nextest run --hide-progress-bar --profile ci --no-default-features --features cksum,openssl || FAULT=1 ; fi
          if (test -n "\$FAULT"); then exit 1 ; fi
          EOF
