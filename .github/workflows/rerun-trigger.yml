name: Rerun Workflows

# spell-checker:ignore octokit

# Let PR authors and collaborators re-run CI from a PR comment, since
# those users have no "Re-run jobs" button in the UI.
#
# Comment commands:
#   /rerun                  - re-run the failed jobs of every failed or
#                             cancelled workflow
#   /rerun <workflow name>  - fully re-run the named workflow's latest run
#                             (e.g. "GnuTests"), whatever its conclusion
#
# Multiple commands can be put on separate lines of the same comment, e.g.:
#   /rerun GnuTests
#   /rerun Android

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  rerun:
    if: >
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/rerun')
    runs-on: ubuntu-slim
    # One rerun request per PR at a time. If several comments arrive while a
    # request is already running, only the most recently queued one survives;
    # GitHub cancels the older pending ones rather than queueing them all.
    concurrency:
      group: rerun-trigger-${{ github.event.issue.number }}
    permissions:
      actions: write #  to list and re-run workflow runs
      pull-requests: write #  to read PR head sha/author
      issues: write #  to react to the triggering comment
    steps:
      - name: "Re-run failed CI for this PR"
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const react = async (content) => {
              try {
                await github.rest.reactions.createForIssueComment({
                  ...context.repo,
                  comment_id: context.payload.comment.id,
                  content,
                });
              } catch (error) {
                core.warning(`Failed to react with '${content}' on the comment: ${error.message}`);
              }
            };

            try {
              await run();
            } catch (error) {
              const message = `Rerun request failed: ${error.message}`;
              await react('-1');
              core.setFailed(message);
            }

            async function run() {
              // Every non-empty line must itself be a /rerun command, so a
              // comment that merely mentions "/rerun" in passing is ignored.
              const rerunLine = /^\/rerun(?:\s+(.+))?$/;
              const lines = context.payload.comment.body
                .split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0);

              if (lines.length === 0 || !lines.every(line => rerunLine.test(line))) {
                core.info('Comment is not a pure /rerun command list; ignoring.');
                return;
              }

              // Dedupe (case-insensitively) while preserving order, so the
              // same workflow named twice isn't rerun twice.
              const seenWorkflowNames = new Set();
              const workflowNames = [];
              for (const line of lines) {
                const name = rerunLine.exec(line)[1]?.trim() || null;
                const key = name ? name.toLowerCase() : '';
                if (!seenWorkflowNames.has(key)) {
                  seenWorkflowNames.add(key);
                  workflowNames.push(name);
                }
              }

              const commenter = context.payload.comment.user.login;
              const association = context.payload.comment.author_association;

              const { data: pr } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: context.issue.number,
              });

              if (pr.state !== 'open') {
                core.info('PR is not open; nothing to rerun.');
                return;
              }

              const isMaintainer = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(association);
              const isPrAuthor = commenter === pr.user.login;

              if (!isMaintainer && !isPrAuthor) {
                await react('-1');
                core.info(`@${commenter} is not authorized to trigger a rerun on this PR.`);
                return;
              }

              // 'head_sha' alone is not enough to identify a run as this PR's.
              // A branch pushed directly to this repo triggers a 'push' run
              // and a 'pull_request' run on the same commit; only the latter
              // is what the PR's checks tab shows. 'pull_requests' is also
              // often empty on fork runs, so a same-SHA run from an unrelated
              // PR or fork could otherwise be picked by mistake.
              const headRepository = pr.head.repo?.full_name;
              const belongsToThisPr = run =>
                run.event === 'pull_request' &&
                run.head_sha === pr.head.sha &&
                run.head_branch === pr.head.ref &&
                run.head_repository?.full_name === headRepository &&
                (!run.pull_requests?.length || run.pull_requests.some(p => p.number === pr.number));

              const rerunNames = [];
              const problems = [];

              // A run is only safe to rerun once it has actually finished.
              // 'action_required' (e.g. a first-time contributor's PR waiting
              // for approval) also reports status 'completed', so it must be
              // excluded explicitly; it must not be force-started by
              // '/rerun <name>', since that would bypass the approval gate.
              const isRerunEligible = run => run.status === 'completed' && run.conclusion !== 'action_required';

              // Fetch every run on the PR's head commit once, up front, and
              // filter it in memory below instead of re-fetching per command.
              const { data: runsOnHead } = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo,
                head_sha: pr.head.sha,
                per_page: 100,
              });
              const runsForThisPr = runsOnHead.workflow_runs.filter(belongsToThisPr);

              for (const workflowName of workflowNames) {
                if (workflowName) {
                  // A named rerun targets only that workflow's latest run on
                  // the PR's head commit, regardless of its conclusion, since
                  // the whole point of naming it is to force a fresh run.
                  // The API already returns runs newest-first, so the first
                  // match is the latest one.
                  const allMatchingRuns = runsForThisPr
                    .filter(run => run.name.toLowerCase() === workflowName.toLowerCase());

                  if (allMatchingRuns.length === 0) {
                    problems.push(`No "${workflowName}" workflow run found for the PR head commit.`);
                    continue;
                  }

                  const [latestRun] = allMatchingRuns;

                  if (!isRerunEligible(latestRun)) {
                    problems.push(`"${workflowName}" is already running or awaiting approval for this PR; wait for it to finish.`);
                    continue;
                  }

                  core.info(`Re-running run ${latestRun.id} (${latestRun.name})`);
                  await github.rest.actions.reRunWorkflow({
                    ...context.repo,
                    run_id: latestRun.id,
                  });
                  rerunNames.push(latestRun.name);
                } else {
                  // A plain '/rerun' only targets runs that are actually broken.
                  // 'failure' and 'timed_out' leave per-job results behind, so
                  // only their failed jobs are rerun. 'cancelled', 'stale', and
                  // 'startup_failure' leave no reliable per-job results, so
                  // those get a full rerun instead.
                  const matchingFailedRuns = runsForThisPr.filter(run => ['failure', 'timed_out'].includes(run.conclusion));
                  const matchingCancelledRuns = runsForThisPr.filter(run => ['cancelled', 'stale', 'startup_failure'].includes(run.conclusion));

                  if (matchingFailedRuns.length === 0 && matchingCancelledRuns.length === 0) {
                    problems.push('No failed, cancelled, timed-out, or stale workflow runs found for the PR head commit.');
                    continue;
                  }

                  for (const run of matchingFailedRuns) {
                    core.info(`Re-running failed jobs of run ${run.id} (${run.name})`);
                    await github.rest.actions.reRunWorkflowFailedJobs({
                      ...context.repo,
                      run_id: run.id,
                    });
                    rerunNames.push(run.name);
                  }

                  for (const run of matchingCancelledRuns) {
                    core.info(`Re-running run ${run.id} (${run.name})`);
                    await github.rest.actions.reRunWorkflow({
                      ...context.repo,
                      run_id: run.id,
                    });
                    rerunNames.push(run.name);
                  }
                }
              }

              if (rerunNames.length === 0) {
                await react('confused');
                core.info(problems.join(' '));
                return;
              }

              await react('+1');
              core.info(`Reran: ${rerunNames.join(', ')}`);
              if (problems.length) {
                core.warning(problems.join(' '));
              }
            }
