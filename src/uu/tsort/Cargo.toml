#spell-checker:ignore (libs) interner
[package]
name = "uu_tsort"
description = "tsort ~ (uutils) topologically sort input (partially ordered) pairs"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/tsort"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lib]
path = "src/tsort.rs"
test = false
doctest = false

[dependencies]
clap = { workspace = true }
fluent = { workspace = true }
hashbrown = { workspace = true }
memchr = { workspace = true }
rustc-hash = { workspace = true }
thiserror = { workspace = true }
uucore = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[target.'cfg(any(unix, target_os = "wasi"))'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(target_os = "wasi")'.dependencies]
# rustix's `std` feature is off at the workspace level; on wasip2 nothing else
# in the graph turns it on, so enable it here for the `AsFd` bound on `fadvise`.
rustix = { workspace = true, features = ["std"] }

[[bin]]
name = "tsort"
path = "src/main.rs"

[dev-dependencies]
divan = { workspace = true }
uucore = { workspace = true, features = ["benchmark"] }

[lints]
workspace = true

[[bench]]
name = "tsort_bench"
harness = false
