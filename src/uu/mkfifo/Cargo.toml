[package]
name = "uu_mkfifo"
description = "mkfifo ~ (uutils) create FIFOs (named pipes)"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/mkfifo"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lib]
path = "src/mkfifo.rs"
test = false
doctest = false

[dependencies]
clap = { workspace = true }
uucore = { workspace = true, features = ["fs", "mode"] }
fluent = { workspace = true }

[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = { workspace = true }

[features]
diagnostics = ["uucore/diagnostics"]
selinux = ["uucore/selinux"]
smack = ["uucore/smack"]

[lints]
workspace = true

[[bin]]
name = "mkfifo"
path = "src/main.rs"
