[package]
name = "uu_timeout"
description = "timeout ~ (uutils) run COMMAND with a DURATION time limit"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/timeout"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lib]
path = "src/timeout.rs"
test = false
doctest = false

[target.'cfg(not(target_os = "fuchsia"))'.dependencies]
clap = { workspace = true }
uucore = { workspace = true, features = ["parser", "process", "signals"] }
fluent = { workspace = true }

[target.'cfg(all(unix, not(target_os = "fuchsia")))'.dependencies]
libc = { workspace = true }
rustix = { workspace = true, features = ["process"] }

[[bin]]
name = "timeout"
path = "src/main.rs"

[dev-dependencies]
divan = { workspace = true }
uucore = { workspace = true, features = ["benchmark"] }

[lints]
workspace = true

[[bench]]
name = "timeout_bench"
harness = false
