[package]
name = "uu_basenc"
description = "basenc ~ (uutils) decode/encode input"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/basenc"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lib]
path = "src/basenc.rs"
test = false
doctest = false

[dependencies]
clap = { workspace = true }
uucore = { workspace = true, features = ["encoding"] }
uu_base32 = { workspace = true }
fluent = { workspace = true }

[dev-dependencies]
divan = { workspace = true }
tempfile = { workspace = true }
uucore = { workspace = true, features = ["benchmark"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["fs", "stdio"] }

[lints]
workspace = true

[[bin]]
name = "basenc"
path = "src/main.rs"

[[bench]]
name = "basenc_bench"
harness = false
