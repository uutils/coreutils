[package]
name = "uu_kill"
description = "kill ~ (uutils) send a signal to a process"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/kill"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lib]
path = "src/kill.rs"
doctest = false

[target.'cfg(not(target_os = "fuchsia"))'.dependencies]
clap = { workspace = true }
thiserror = { workspace = true }
uucore = { workspace = true, features = ["process", "signals"] }
fluent = { workspace = true }

[target.'cfg(all(unix, not(target_os = "fuchsia")))'.dependencies]
libc = { workspace = true }
rustix = { workspace = true, features = ["process"] }

[lints]
workspace = true

[[bin]]
name = "kill"
path = "src/main.rs"
