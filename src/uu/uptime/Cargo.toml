# spell-checker:ignore logind

[package]
name = "uu_uptime"
description = "uptime ~ (uutils) display dynamic system information"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/uptime"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[features]
feat_systemd_logind = ["uucore/feat_systemd_logind"]

[lib]
path = "src/uptime.rs"
test = false
doctest = false

[target.'cfg(all(unix, not(any(target_os = "android", target_os = "fuchsia", target_os = "redox"))))'.dependencies]
clap = { workspace = true }
thiserror = { workspace = true }
uucore = { workspace = true, features = ["libc", "utmpx", "uptime"] }
fluent = { workspace = true }
jiff = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "uptime"
path = "src/main.rs"
required-features = ["uucore/default"]
