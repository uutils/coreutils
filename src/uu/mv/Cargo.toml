[package]
name = "uu_mv"
description = "mv ~ (uutils) move (rename) SOURCE to DESTINATION"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/mv"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lib]
path = "src/mv.rs"
doctest = false

[dependencies]
clap = { workspace = true }
fluent = { workspace = true }
indicatif = { workspace = true }
libc = { workspace = true }
nix = { workspace = true, features = ["fs"] }
rustc-hash = { workspace = true }
thiserror = { workspace = true }
uucore = { workspace = true, features = [
  "backup-control",
  "buf-copy",
  "fs",
  "perms",
  "safe-copy",
  "update-control",
] }

[target.'cfg(any(target_os = "freebsd", target_os = "hurd", target_os = "linux", target_os = "android", target_os = "netbsd"))'.dependencies]
uucore = { workspace = true, features = ["fsxattr"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
rustix = { workspace = true, features = ["fs"] }

[[bin]]
name = "mv"
path = "src/main.rs"

[dev-dependencies]
divan = { workspace = true }
tempfile = { workspace = true }
uucore = { workspace = true, features = ["benchmark"] }

[features]
selinux = ["uucore/selinux"]

[lints]
workspace = true

[[bench]]
name = "mv_bench"
harness = false
