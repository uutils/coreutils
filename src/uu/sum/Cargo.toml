[package]
name = "uu_sum"
description = "sum ~ (uutils) display checksum and block counts for input"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/sum"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lib]
path = "src/sum.rs"
test = false
doctest = false

[dependencies]
clap = { workspace = true }
uucore = { workspace = true }
fluent = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "freebsd"))'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[lints]
workspace = true

[[bin]]
name = "sum"
path = "src/main.rs"
