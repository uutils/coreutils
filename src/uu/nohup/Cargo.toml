[package]
name = "uu_nohup"
description = "nohup ~ (uutils) run COMMAND, ignoring hangup signals"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/nohup"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lib]
path = "src/nohup.rs"
test = false
doctest = false

[target.'cfg(any(unix, windows))'.dependencies]
clap = { workspace = true }
fluent = { workspace = true }
libc = { workspace = true }
rustix = { workspace = true, features = ["stdio"] }
thiserror = { workspace = true }
uucore = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

[features]
default = ["signals"]
signals = ["uucore/signals"]

[lints]
workspace = true

[[bin]]
name = "nohup"
path = "src/main.rs"
required-features = ["uucore/default"]
