[package]
name = "uu_tty"
description = "tty ~ (uutils) display the name of the terminal connected to standard input"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/tty"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lib]
path = "src/tty.rs"
test = false
doctest = false

[target.'cfg(not(target_os = "fuchsia"))'.dependencies]
clap = { workspace = true }
uucore = { workspace = true, features = ["fs"] }
fluent = { workspace = true }

[target.'cfg(all(unix, not(target_os = "fuchsia")))'.dependencies]
rustix = { workspace = true, features = ["fs", "termios"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Storage_FileSystem",
  "Win32_Foundation",
] }

[lints]
workspace = true

[[bin]]
name = "tty"
path = "src/main.rs"
