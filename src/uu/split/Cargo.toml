[package]
name = "uu_split"
description = "split ~ (uutils) split input into output files"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/split"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lib]
path = "src/split.rs"
doctest = false

[dependencies]
clap = { workspace = true }
memchr = { workspace = true }
uucore = { workspace = true, features = ["fs", "parser-size"] }
thiserror = { workspace = true }
fluent = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "freebsd"))'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[[bin]]
name = "split"
path = "src/main.rs"

[dev-dependencies]
divan = { workspace = true }
tempfile = { workspace = true }
uucore = { workspace = true, features = ["benchmark"] }

[lints]
workspace = true

[[bench]]
name = "split_bench"
harness = false
