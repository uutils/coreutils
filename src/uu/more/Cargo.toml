[package]
name = "uu_more"
description = "more ~ (uutils) input perusal filter"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/more"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lib]
path = "src/more.rs"
doctest = false

[dependencies]
clap = { workspace = true }
# use-dev-tty: avoid mio's tight loop on tty EOF/hangup (see #15258); also
# needed on macOS for event init when stdin is a pipe.
crossterm = { workspace = true, features = ["events", "use-dev-tty"] }
fluent = { workspace = true }
uucore = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["event"] }

[target.'cfg(windows)'.dependencies]
crossterm = { workspace = true, features = ["windows"] }

[[bin]]
name = "more"
path = "src/main.rs"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
