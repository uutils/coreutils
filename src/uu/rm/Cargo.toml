[package]
name = "uu_rm"
description = "rm ~ (uutils) remove PATHNAME"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/rm"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lib]
path = "src/rm.rs"
doctest = false

[dependencies]
clap = { workspace = true }
fluent = { workspace = true }
indicatif = { workspace = true }
thiserror = { workspace = true }
uucore = { workspace = true, features = ["fs", "parser", "quoting-style"] }

[target.'cfg(all(unix, not(any(target_os = "aix", target_os = "hurd", target_os = "redox"))))'.dependencies]
uucore = { workspace = true, features = ["safe-traversal"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[[bin]]
name = "rm"
path = "src/main.rs"

[dev-dependencies]
divan = { workspace = true }
tempfile = { workspace = true }
uucore = { workspace = true, features = ["benchmark"] }

[lints]
workspace = true

[[bench]]
name = "rm_bench"
harness = false

[[bench]]
name = "rm_alloc_count"
harness = false
