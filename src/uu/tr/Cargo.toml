[package]
name = "uu_tr"
description = "tr ~ (uutils) translate characters within input and display"
repository = "https://github.com/uutils/coreutils/tree/main/src/uu/tr"
version.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true

[lib]
path = "src/tr.rs"
test = false
doctest = false

[dependencies]
bytecount = { workspace = true, features = ["runtime-dispatch-simd"] }
clap = { workspace = true }
fluent = { workspace = true }
nom = { workspace = true }
uucore = { workspace = true, features = ["fs", "signals"] }

[dev-dependencies]
divan = { workspace = true }
rustix = { workspace = true, features = ["stdio", "fs"] }
uucore = { workspace = true, features = ["benchmark"] }

[features]
diagnostics = ["uucore/diagnostics"]

[lints]
workspace = true

[[bin]]
name = "tr"
path = "src/main.rs"

[[bench]]
name = "tr_bench"
harness = false
